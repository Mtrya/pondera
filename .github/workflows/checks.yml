name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Install CPU dependencies
        run: |
          uv venv
          uv export --frozen --group dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uv pip install --torch-backend cpu -c /tmp/requirements.txt -e . --group dev
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo /usr/games >> "$GITHUB_PATH"
      - name: Install fastchess
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/fastchess.tar" https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo "1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  $RUNNER_TEMP/fastchess.tar" | sha256sum --check
          mkdir "$RUNNER_TEMP/fastchess-bin"
          tar -xf "$RUNNER_TEMP/fastchess.tar" -C "$RUNNER_TEMP/fastchess-bin" --strip-components=1 fastchess-linux-x86-64/fastchess
          echo "$RUNNER_TEMP/fastchess-bin" >> "$GITHUB_PATH"
      - name: Validate package and imports
        run: |
          cargo +stable fmt --manifest-path rust/chess/Cargo.toml --check
          uv lock --check
          uv run --no-sync python -c 'from importlib.util import find_spec; assert find_spec("chess") is None'
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync lint-imports
      - name: Run behavioral tests
        run: |
          command -v stockfish
          fastchess --version
          ulimit -c 0
          timeout --signal=ABRT --kill-after=10s 5m uv run --no-sync python -X faulthandler -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          uv build
          uv venv "$RUNNER_TEMP/pondera-wheel"
          uv pip install --python "$RUNNER_TEMP/pondera-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          pondera-wheel/bin/python -c 'from importlib.util import find_spec; from pondera.chess._rules import Board; assert find_spec("chess") is None; assert Board().legal_move_count() == 20'
