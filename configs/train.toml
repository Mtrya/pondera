[model]
hidden_size = 1024
intermediate_size = 2240
num_heads = 8
num_kv_heads = 2
factorized_move_head = true
block_attn_res = true

[[model.segments]]
blocks = ["kda", { attention = "kda", group_end = true }]

[[model.segments]]
repeat = 2
blocks = [
  "kda",
  { attention = "softmax", navigation = true, group_end = true },
  "kda",
  { attention = "kda", group_end = true },
]

[[model.segments]]
blocks = [
  "kda",
  { attention = "softmax", value_source = "token_embedding", group_end = true },
]

[training]
seed = 640
# Recompute block activations during backward to fit long documents.
activation_checkpointing = true
# Hidden matrices use Hyperball. Set optimizer = "muon" for the unconstrained update.
optimizer = "hyperball"
muon_lr = 0.0375
adamw_lr = 0.0003
# Linear warmup over the first 5% of the training budget, then cosine decay.
warmup_fraction = 0.05
# Final learning rates as a fraction of the peaks above.
min_lr_ratio = 0.1
adamw_weight_decay = 0.0
microbatch_tokens = 131072
update_tokens = 524288
presentations = 1.0
# Omit documents to use every eligible training document.
# documents = 50000
# Omit max_document_tokens to use the encoded dataset's recipe cap.
# max_document_tokens = 131072
# If set, updates replaces presentations as the stopping condition.
# updates = 1000
val_every = 10
checkpoint_every = 50
checkpoint_keep_last = 3
