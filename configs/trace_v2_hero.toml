# Hero-run configuration: the first 500k-root release of grammar-v2 traces.
#
# This file pins the data identity of the hero collection: the per-root recipe
# distributions (teacher width, depth, presentation), the BOARD observation
# frequencies, and the synthesis rules. It inherits every invariant from
# trace_v2.toml; only the sections differing from that default are commented
# at length. The actual collection directory holds the exact config copy whose
# SHA-256 the collection manifest records.
#
# Reproducibility: with this file, the pool file (roots.jsonl with its
# manifest), the teacher contract, and the instrumented engine binary fixed,
# collection is byte-reproducible. Engine location is environment, not a
# search parameter, but the resolved binary's SHA-256 is always recorded.

[engine]
# Absolute path to the instrumented teacher binary, or a bare executable name
# resolved on PATH. The binary must expose the TraceLog option; the official
# binary is used only as the search-output reference for the consistency gate.
# The collector refuses a binary that cannot trace and records the resolved
# binary's SHA-256 plus the instrumentation diff's SHA-256. Changing the
# binary changes every value in the dataset.
path = "stockfish"

[search]
# Fallback search depth and MultiPV width. Under an active [recipe] table they
# apply only to tables the recipe omits; here every root's width and depth are
# drawn per root, so these values are documentation, not driver.
depth = 16
teacher_width = 1

# Engine threads. Recorded data requires 1. More threads make node counts,
# PVs, and sidecar order depend on scheduling, which breaks byte-exact
# reproduction and the event-order invariants. This is a data-identity knob,
# not a throughput knob.
threads = 1

# Transposition-table size in MiB, fixed for a whole release. The table
# changes move ordering, pruning, node counts, and occasionally values, so it
# is part of the data identity rather than a speed-only setting. The same
# value must be used for every root in a release.
hash_mb = 256

# Restart the engine before every root. True is required for recorded data:
# the rounds of one root share the transposition and history tables (that
# sharing is the demonstrated process), while different roots must not share
# anything. False leaks state across roots and destroys reproducibility; the
# collector rejects it for recorded releases.
fresh_engine_per_root = true

# Roots collected in parallel. Each worker owns one engine process and one
# root at a time, so peak memory is about workers * hash_mb plus sidecar
# writing. Worker count changes wall time only; per-root records are identical
# for any value. It is not a statistical parameter and is not recorded as part
# of the data identity, only as an execution detail.
workers = 8

# Per-root recipe for the hero release. Each root independently draws
#   width:        1, 2, or 3 PV lines   at 50% / 25% / 25%;
#   depth:        12, 16, or 20         at 25% / 50% / 25%;
#   presentation: zero / full / random  at 1/9 / 5/9 / 1/3,
# from random.Random(f"{seed}:{root_id}:<table>") with seed = [smoke] seed.
# The three marginal distributions are independent by construction. Width
# shapes trace volume and the refutation bar (W = 1 is the single-champion
# spine, also serving as the internal control arm); depth shapes the
# converged-depth and trace-length distributions (d20 is the new deep arm
# validated by the pre-hero pilot); presentation sets the mixture of
# supervised thinking length, including the zero arm that trains the
# policy-plus-value direct answer. The release writes exactly one
# presentation per root, so the mixture below is the row mixture.
[recipe]
widths = {1 = 0.50, 2 = 0.25, 3 = 0.25}
depths = {12 = 0.25, 16 = 0.50, 20 = 0.25}
presentations = {zero = 0.111111111, full = 0.555555556, random = 0.333333333}

[board]
# Per-ply hazard of inserting a BOARD observation on the downward spine. After
# each written spine move, measured from the previous observation or from the
# root at round start, a geometric gap is drawn with this per-ply probability;
# the mean gap is 1 / hazard (10 plies at 0.10). Only descending moves
# trigger it, not return evaluations and not root evaluations; the root never
# requests a board because the root board is the prefix. Higher values raise
# observation density, sequence length, and the share of zero-loss tool
# response tokens, and give the model more frequent observation practice.
# 0 disables descent boards; 1 observes after every spine move.
board_descent_hazard = 0.10

# Probability that an exact frontier evaluation is immediately preceded by a
# BOARD request and its response (move, BOARD, response, evaluation). It
# applies only to exact frontier evaluations on the spine: not to root or
# return evaluations, not to refutations. It is independent of the descent
# hazard, so both sources can fire on the same node. It sets the frequency of
# the "refresh the position, then commit" adjacency and therefore the amount
# of tool supervision near decisions. 1 makes the adjacency deterministic;
# 0 removes it.
board_frontier_p = 0.40

[presentation]
# Inert under the hero recipe: the recipe's presentation table selects one
# presentation per root at release time, so these four shares do not drive the
# release. They remain because the config schema requires the table; they
# describe the four-presentation mode a recipe-free release would write.
#   zero:      final answer and variation with no thinking; the direct-answer
#              baseline and the policy-plus-value-only view.
#   full:      the complete trace.
#   random:    one cut at a random interior boundary; see the fractions below.
#   last_root: the boundary immediately before the last round's root
#              evaluation, which exercises stopping just short of the answer.
# The four values must sum to 1.
zero = 0.10
full = 0.50
random = 0.30
last_root = 0.10

# Random cuts are drawn uniformly over token positions in [0.05, 0.95] of the
# full trace's thinking tokens (the part before FINAL), then moved forward to
# the next operation boundary. A BOARD request is never separated from its
# response. The interval excludes cuts in the first and last few tokens;
# widening it adds more extreme truncations. The fraction is of thinking
# tokens, not of the full row including the answer suffix. Larger coverage of
# the interval spreads supervision over more causal horizons.
random_min_fraction = 0.05
random_max_fraction = 0.95

[synthesis]
# Confirmatory repetitions. "faithful" writes every completed round's root
# evaluation even when it equals the previous round's value: a real
# recomputation is the convergence signal and is supervised. Compressing it
# would shorten traces and remove that signal, shifting the value-trajectory
# and length distributions. "faithful" is the only value accepted for
# releases; no compressed form is defined yet.
confirmatory_repetition = "faithful"

# Root draw claims. When true and a draw is claimable at the root from the
# source game's history (the position has occurred at least three times, or
# the halfmove clock is at least 100) and the champion's raw root value is at
# most +1, the final action is a draw claim with no variation. The bound is +1
# rather than 0 because the engine's rule-draw score is a ±1 anti-cycling
# jitter (VALUE_DRAW - 1 + (nodes & 0x2)): the whole band means "not better
# than a draw", so losing and draw-valued claimable roots claim, and only a
# genuinely winning root keeps the normal move, evaluation, and variation.
# This is the only action label not emitted by the engine; it is derived from
# rule facts plus the engine's real value. False removes the label entirely,
# leaving that token unsupervised and hiding the claimable-but-losing
# contrast. The calibration probe is: claim exactly when the reported root
# evaluation is at most a draw (the jitter band quantizes to the zero bin).
claim_draw = true

[smoke]
# In this file the section sizes the hero selection: how many roots the
# collector draws from the --roots pool file. The hero pool file holds exactly
# 500,000 train plus 7,812 validation roots, so the selection below takes the
# whole pool in file order.
roots = 507812

# Root sampling seed. It drives the pool selection above and every per-root
# recipe draw (f"{seed}:{root_id}:<table>"). Sampling is reproducible and
# independent of engine behavior: the seed changes which roots enter the
# sample and which arm each root lands in, never how a root is searched. It is
# recorded in the manifest together with the root-selection hash.
seed = 640

# Default local output directory for sidecars, synthesized rows, manifests,
# and the statistics report; the hero run overrides it with --output. It is
# untracked and never part of a release.
output = ".local/runs/trace-v2-hero"
