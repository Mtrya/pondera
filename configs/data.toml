seed = 640
max_document_tokens = 131072

[sources.elite]
kind = "pgn"
url = "https://database.nikonoel.fr/lichess_elite_2025-11.zip"
sha256 = "1ffa577aa0a1352fa04c9a890a6706049a3a79edc52810b136758d1e2a1a2eab"
train = 500000
val = 2000
claimable_share = 0.03
# Omit limit_games to preprocess the complete archive.
# limit_games = 100

[sources.puzzles]
kind = "lichess_puzzles"
repo_id = "Lichess/chess-puzzles"
revision = "461725966ea46898ec6481372a6326de3281bfbd"
train = 0
val = 0
batch_size = 1024

[search]
hash_mb = 256
# Roots whose search exceeds this deadline are dropped from the release
# (recorded under "dropped" in release.json) and never retried.
timeout_seconds = 1800
# Syzygy tablebases: a worker-local directory of WDL/DTZ files. Empty path
# disables probing (recorded as 0 in the release identity); the probe limit
# caps the probed piece count.
syzygy_path = ""
syzygy_probe_limit = 7
joint = [
    { width = "full", depth = 8, probability = 0.30 },
    { width = 8, depth = 10, probability = 0.25 },
    { width = 3, depth = 16, probability = 0.25 },
    { width = 1, depth = 24, probability = 0.20 },
]

[synthesis]
claim_draw = true
board_descent_hazard = 0.15
board_frontier_p = 0.5
presentations = { zero = 0.10, full = 0.50, random = 0.40 }
random_min_fraction = 0.05
random_max_fraction = 0.95

[release]
shard_size = 1024
workers = 8
start_shard = 0
# end_shard is exclusive; omit it to process the remaining shards.
# end_shard = 1

[merge]
# Total vocabulary size, including the fixed base vocabulary.
vocab_size = 8192
fit_split = "train"
holdout_fraction = 0.0
min_count = 8
per_length_limit = 20000
selection_stride = 1
max_rounds = 100000
top = 20
# Fitting/encoding worker processes; results are identical at any count.
workers = 8
# Omit max_roots to use all input roots; block defaults to max(8, composites // 32).
# max_roots = 128
# block = 32

batch_size = 128
