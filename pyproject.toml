[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "pondera"
version = "0.3.0"
description = "Search-free chess training with internalized search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "huggingface-hub>=1.5.0",
    "numpy>=2.4.2",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
]

[project.optional-dependencies]
data = ["datasets>=4.6.1", "pyarrow>=23.0.1", "tqdm>=4.67.3"]
training = ["swanlab>=0.7.10", "transformers>=5.3.0"]

[project.scripts]
pondera-uci = "pondera.cli.uci:main"
pondera-match = "pondera.cli.match:main"
pondera-evaluate = "pondera.cli.evaluate:main"
pondera-train = "pondera.cli.train:main"
pondera-prepare = "pondera.cli.prepare:main"
pondera-annotate = "pondera.cli.annotate:main"
pondera-human = "pondera.cli.human:main"
pondera-stockfish = "pondera.cli.stockfish:main"
pondera-publish = "pondera.cli.publish:main"

[dependency-groups]
dev = ["ruff>=0.15.0", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pondera.evaluation" = ["*.epd"]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.importlinter]
root_package = "pondera"

[[tool.importlinter.contracts]]
name = "Representation is independent of application code"
type = "forbidden"
source_modules = ["pondera.chess"]
forbidden_modules = ["pondera.models", "pondera.data", "pondera.training", "pondera.inference", "pondera.evaluation", "pondera.cli"]

[[tool.importlinter.contracts]]
name = "Models do not depend on workflows"
type = "forbidden"
source_modules = ["pondera.models"]
forbidden_modules = ["pondera.data", "pondera.training", "pondera.inference", "pondera.evaluation", "pondera.cli"]

[[tool.importlinter.contracts]]
name = "Training is separate from inference and evaluation"
type = "forbidden"
source_modules = ["pondera.training"]
forbidden_modules = ["pondera.inference", "pondera.evaluation", "pondera.cli", "pondera.data.stockfish", "pondera.data.annotation"]

[[tool.importlinter.contracts]]
name = "Inference does not import training or evaluation"
type = "forbidden"
source_modules = ["pondera.inference"]
forbidden_modules = ["pondera.training", "pondera.evaluation", "pondera.cli"]

[[tool.importlinter.contracts]]
name = "Commands depend on implementations"
type = "forbidden"
source_modules = ["pondera.data", "pondera.evaluation"]
forbidden_modules = ["pondera.cli", "pondera.training"]
