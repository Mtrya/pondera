[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "pondera"
version = "0.3.0"
description = "Search-free chess training with internalized search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "huggingface-hub>=1.5.0",
    "numpy>=2.4.2",
    "orjson>=3.13,<4",
    "pyarrow>=26,<27",
    "swanlab>=0.7.10",
    "torch>=2.10.0",
]

[dependency-groups]
dev = ["ruff>=0.15.0", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pondera.evaluation" = ["*.epd"]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.importlinter]
root_package = "pondera"

[[tool.importlinter.contracts]]
name = "Representation is independent of application code"
type = "forbidden"
source_modules = ["pondera.chess"]
forbidden_modules = ["pondera.models", "pondera.data", "pondera.training", "pondera.inference", "pondera.evaluation"]

[[tool.importlinter.contracts]]
name = "Models do not depend on workflows"
type = "forbidden"
source_modules = ["pondera.models"]
forbidden_modules = ["pondera.data", "pondera.training", "pondera.inference", "pondera.evaluation"]

[[tool.importlinter.contracts]]
name = "Training is separate from inference and evaluation"
type = "forbidden"
source_modules = ["pondera.training"]
forbidden_modules = ["pondera.inference", "pondera.evaluation"]

[[tool.importlinter.contracts]]
name = "Inference does not import training or evaluation"
type = "forbidden"
source_modules = ["pondera.inference"]
forbidden_modules = ["pondera.training", "pondera.evaluation"]

[[tool.importlinter.contracts]]
name = "Data and evaluation do not depend on training"
type = "forbidden"
source_modules = ["pondera.data", "pondera.evaluation"]
forbidden_modules = ["pondera.training"]
